name: Deploy to GitHub Pages

on:
  # The site is offline for now, so pushes do not publish it.
  # To publish again: add these two lines back under "on:", then push.
  #   push:
  #     branches: [main]
  # A manual run from the Actions tab still works.
  workflow_dispatch:

# Nothing gets write access by default. Only the deploy job below can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to exact commits so a moved tag cannot change what runs.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, build and upload the site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        env:
          # The site URL is never hard-coded.
          # Default: https://<owner>.github.io, with the repo name as the base path
          # (or no base path if the repo is named <owner>.github.io).
          # Custom domain later: add a repository variable SITE_URL, e.g. https://example.com
          # (Settings > Secrets and variables > Actions > Variables). The base path then becomes "/".
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || (vars.SITE_URL && '/') || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/') || format('/{0}', github.event.repository.name) }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can publish, and only to GitHub Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
